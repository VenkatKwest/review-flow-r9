# Posts a commit status for the pull request head, like a required status set by a
# pull_request_target workflow.
name: internal-tests
on:
  pull_request_target:
    types: [opened, reopened, synchronize]
permissions:
  statuses: write
jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.payload.pull_request.head.sha,
              state: 'success',
              context: 'internal-tests',
              description: 'Does not affect internal tests.',
            });
